name: Build iOS IPA

on:
  # 仅在手动触发时构建 iOS IPA（避免每次 push 都跑 macOS runner，消耗额度）
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm deps
        run: npm ci || npm install

      - name: Build web assets
        run: npm run build

      - name: Add Capacitor iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      # 后台播放：ios/ 是 .gitignore 的，每次 CI 都重新生成，
      # 所以 Info.plist 的补丁必须在这里注入 —— 否则 App 一切到后台就停歌。
      # 对应 README「iOS 后台播放补丁」，以前靠手动改，CI 里从未生效过。
      - name: Patch Info.plist (background audio)
        run: |
          PLIST=ios/App/App/Info.plist
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          fi
          echo "=== UIBackgroundModes ==="
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      - name: Sync web -> iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      # 直接 build 出无签名的 .app，然后用 zip 打成一个无签名 IPA
      # 这是给 Sideloadly 等工具二次签名的中间产物
      - name: Build (unsigned)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -ry ../../../../App.ipa Payload
          ls -lh ../../../../App.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipodplayer-ipa
          path: ios/App/App.ipa
          if-no-files-found: error
          retention-days: 14